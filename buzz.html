<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#05081f">
  <title>Bearcat Jeopardy Buzzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bitter:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .phone { height: 100%; display: flex; flex-direction: column; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); gap: 14px; }
    .phone header { justify-content: center; }
    .brand { font-size: 26px; }
    .screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; min-height: 0; }
    .msg strong { color: var(--ink); }
    .code-in { font-family: var(--f-display); font-size: 40px; letter-spacing: .3em; text-align: center; text-transform: uppercase;
      width: 220px; padding: 8px; background: var(--edge); color: var(--gold); border: 2px solid var(--cell-hi); border-radius: 8px; }
    .pick { display: grid; gap: 10px; width: min(420px, 100%); overflow-y: auto; padding: 4px; }
    .pick .pp { min-height: 64px; }
    .pick .pp[aria-disabled="true"] { opacity: .55; }
    .pick .pp small { font-family: var(--f-data); font-size: 11px; color: var(--ink); }
    .new-player { display: flex; gap: 8px; width: min(420px, 100%); }
    .new-player input { flex: 1; min-width: 0; background: var(--edge); border: 2px solid var(--cell-hi); border-radius: 6px; padding: 10px 12px; font-size: 18px; color: var(--ink); }

    .me { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; font-family: var(--f-data); }
    .me .nm { font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .me .sc { font-family: var(--f-display); font-size: 28px; }
    .me button { background: none; border: 0; color: var(--muted); font-family: var(--f-data); font-size: 12px; text-decoration: underline; padding: 6px; }

    /* The buzzer */
    .buzz {
      width: min(78vw, 52vh, 360px); aspect-ratio: 1; border-radius: 50%; border: 0; padding: 0;
      display: grid; place-items: center; position: relative;
      font-family: var(--f-display); font-size: clamp(40px, 14vw, 72px); letter-spacing: .04em; color: var(--ink);
      text-shadow: 0 0 6px var(--edge), 3px 3px 0 var(--edge);
      box-shadow: 0 10px 0 color-mix(in srgb, var(--pc) 40%, black), 0 14px 30px rgba(0, 0, 0, .6), inset 0 0 0 8px var(--pc);
      transition: transform 80ms ease, box-shadow 80ms ease, filter 200ms ease;
    }
    .buzz:active, .buzz.pressed { transform: translateY(8px); box-shadow: 0 2px 0 color-mix(in srgb, var(--pc) 40%, black), 0 4px 12px rgba(0, 0, 0, .6), inset 0 0 0 8px var(--pc); }
    .buzz[data-state="idle"], .buzz[data-state="locked"], .buzz[data-state="note"] { filter: grayscale(.85) brightness(.55); }
    .buzz[data-state="armed"] { animation: armed 1.1s ease-in-out infinite; }
    @keyframes armed { 50% { box-shadow: 0 10px 0 color-mix(in srgb, var(--pc) 40%, black), 0 0 46px var(--gold), inset 0 0 0 8px var(--gold); } }
    .buzz[data-state="first"] { box-shadow: 0 10px 0 #8a6a12, 0 0 60px var(--gold), inset 0 0 0 10px var(--gold); }
    .status { font-family: var(--f-display); font-size: clamp(24px, 7vw, 36px); text-transform: uppercase; color: var(--gold); margin: 0; min-height: 1.2em; }
    .status.dim { color: var(--muted); }
    .status.bad { color: var(--bad); }
    .detail { font-family: var(--f-data); font-size: 15px; color: var(--ink); margin: 0; min-height: 1.4em; }
    .order { list-style: none; margin: 0; padding: 0; width: min(360px, 100%); font-family: var(--f-data); font-size: 14px; }
    .order li { display: flex; justify-content: space-between; padding: 4px 8px; border-radius: 4px; }
    .order li.mine { background: rgba(242, 193, 78, .15); }
    .conn { font-family: var(--f-data); font-size: 12px; color: var(--muted); text-align: center; }
    .conn.bad { color: var(--bad); }
    .fj { width: min(420px, 100%); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
    .fj .me { margin-bottom: 4px; }
    .fj-title { font-family: var(--f-display); font-weight: 400; text-transform: uppercase; color: var(--gold); font-size: 34px; margin: 0; letter-spacing: .03em; }
    .fj-big { font-family: var(--f-display); font-size: 26px; text-transform: uppercase; margin: 0; color: var(--ink); }
    .fj-big strong { color: var(--gold); font-weight: 400; }
    .fj-label { display: grid; gap: 8px; width: 100%; font-family: var(--f-data); font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); text-align: left; }
    .fj-input { background: var(--edge); border: 2px solid var(--cell-hi); border-radius: 8px; padding: 12px; font-size: 22px; color: var(--ink); font-family: var(--f-clue); text-transform: none; width: 100%; }
    .fj-mine { font-family: var(--f-clue); font-weight: 700; font-size: 20px; color: var(--gold); margin: 0; overflow-wrap: anywhere; }
    .phone .screen { overflow-y: auto; }
    @media (prefers-reduced-motion: reduce) { .buzz[data-state="armed"] { animation: none; box-shadow: 0 10px 0 #000, 0 0 40px var(--gold), inset 0 0 0 8px var(--gold); } }
  </style>
</head>
<body>
  <div class="phone">
    <header><h1 class="brand">Bearcat <span>Buzzer</span></h1></header>
    <main id="screen" class="screen" aria-live="polite"></main>
    <p id="conn" class="conn"></p>
  </div>
  <script src="buzzer.js"></script>
  <script src="phone.js"></script>
</body>
</html>
